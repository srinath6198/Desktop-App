services:
  - type: web
    name: flower-billing-backup-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: flower_billing
      - key: BACKUP_API_TOKEN
        generateValue: true
